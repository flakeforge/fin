$schema: https://moonrepo.dev/schemas/project.json

layer: application
language: go

tags:
  - server

tasks:
  build:
    description: Build the server application
    command: go build -o $projectRoot/bin/server.exe $projectRoot/cmd/app
    inputs:
      - cmd/**/*
    outputs:
      - bin

  test:
    description: Run server tests
    command: go test ./...

  lint:
    description: Lint the server codebase
    command: golangci-lint run

  format:
    description: Format the server codebase
    command: gofmt -w .

  deploy:
    description: Deploy the server application
    command: moon deploy
