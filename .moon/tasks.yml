$schema: https://moonrepo.dev/schemas/tasks.json

tasks:
  build:
    description: Build the project
    command: moon build

  test:
    description: Run tests
    command: moon test

  lint:
    description: Lint the codebase
    command: moon lint

  format:
    description: Format the codebase
    command: moon format

  deploy:
    description: Deploy the application
    command: moon deploy
